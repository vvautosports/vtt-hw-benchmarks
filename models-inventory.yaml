version: "1.0"
mode: "default"  # "light" (1-2 models, <16GB), "default" (5 models), or "all" (20 models)
model_dir: "/mnt/ai-models"

# Test Strategy Notes:
# - llama-bench: Quick baseline (512p/128g), single-file models only
# - llama-server: Comprehensive testing, supports multi-part models
# - See docs/guides/MULTI-PART-MODEL-TESTING.md for details

# Light mode: 1-2 small models for 16GB VRAM systems
light_models:
  # Reconciled 2026-08-26 (issue #8): on-disk copy is UD-Q8_K_XL, not F16
  - name: "GPT-OSS-20B"
    path: "unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-UD-Q8_K_XL.gguf"
    size_gb: 13
    vram_gb: 14
    use_case: "Speed champion - fits on 16GB GPU"
    hf_repo: "unsloth/gpt-oss-20b-GGUF"
    hf_file: "gpt-oss-20b-UD-Q8_K_XL.gguf"

  # DRIFT (2026-08-26, issue #8): not on Framework /mnt/ai-models — re-download
  # on first light-mode run (small model, quick pull)
  - name: "Qwen3-8B-128K-Q8"
    path: "Qwen3-8B-128K-Q8/qwen3-8b-128k-q8_0.gguf"
    size_gb: 9
    vram_gb: 10
    use_case: "Latest Qwen3 with 128K context"
    hf_repo: "unsloth/Qwen3-8B-128K-GGUF"
    hf_file: "qwen3-8b-128k-q8_0.gguf"

# Default 5 models for standard testing (requires 128GB RAM + large UMA)
# GLM-4.7-Flash-Q8 first: single file, current champion, works with quick test
default_models:
  # Reconciled 2026-08-26 (issue #8): actual dir is unsloth/GLM-4.7-Flash-GGUF
  - name: "GLM-4.7-Flash-Q8"
    path: "unsloth/GLM-4.7-Flash-GGUF/GLM-4.7-Flash-UD-Q8_K_XL.gguf"
    size_gb: 33
    vram_gb: 35
    parts: 1
    test_strategy: "both"  # Works with llama-bench (quick) and llama-server (comprehensive)
    use_case: "Current champion - best efficiency"
    hf_repo: "unsloth/GLM-4.7-Flash-GGUF"
    hf_file: "GLM-4.7-Flash-UD-Q8_K_XL.gguf"

  # REMOVED 2026-08-26 (issue #8 reconcile): DeepSeek-R1-Distill-Llama-70B —
  # not on Framework disk (gone in/before the 504GB cleanup). Dense-reasoning
  # control role now covered by Apriel-1.5-15b-Thinker (retention table in
  # UNSLOTH-DIRECTION.md); re-add with a fresh entry if a dense-70B control
  # is needed again.

  # MiniMax-M2.1 deleted 2026-08-26 (retention policy: successor M2.5 on disk)
  - name: "MiniMax-M2.5"
    path: "unsloth/MiniMax-M2.5-GGUF/MiniMax-M2.5-UD-Q3_K_XL-00001-of-00004.gguf"
    size_gb: 95
    vram_gb: 100
    parts: 4
    test_strategy: "server_only"  # Multi-part: requires llama-server, skip llama-bench
    use_case: "Current-gen large MoE (successor to M2.1)"
    hf_repo: "unsloth/MiniMax-M2.5-GGUF"
    hf_file: "MiniMax-M2.5-UD-Q3_K_XL-00001-of-00004.gguf"

  - name: "Qwen3.8-Flash-Next"
    # Day-one model (released 2026-08-26): 125B-A6B MoE, Qwen4 arch, 262K ctx.
    # Thinker/driver candidate for the dual-agent architecture (UNSLOTH-DIRECTION.md).
    # Sweep target #1 for the llama.cpp-version suite. Currently in HF cache on
    # Framework root (served via unsloth run) — move to /mnt/ai-models after validation.
    path: "unsloth/Qwen3.8-Flash-Next-GGUF/UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf"
    size_gb: 84
    vram_gb: 90
    parts: 3
    test_strategy: "server_only"  # Multi-part (3 files): requires llama-server
    use_case: "Thinker candidate — long-context MoE, reasoning_effort dial"
    hf_repo: "unsloth/Qwen3.8-Flash-Next-GGUF"
    hf_file: "UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf"

  # Reconciled 2026-08-26 (issue #8): actual dir is Qwen/qwen3-235b-a22b
  - name: "Qwen3-235B-A22B-Instruct"
    path: "Qwen/qwen3-235b-a22b/Qwen3-235B-A22B-Instruct-2507-UD-Q3_K_XL-00001-of-00003.gguf"
    size_gb: 98
    vram_gb: 105
    parts: 3
    test_strategy: "server_only"  # Multi-part (3 files): requires llama-server
    use_case: "Ultra-large model testing (235B params)"
    baseline: "parameter-scaling / prev-gen large MoE (retention-policy control)"
    hf_repo: "unsloth/Qwen3-235B-A22B-Instruct-GGUF"
    hf_file: "Qwen3-235B-A22B-Instruct-2507-UD-Q3_K_XL-00001-of-00003.gguf"

  # Reconciled 2026-08-26 (issue #8): on-disk copy is UD-Q8_K_XL, not F16
  - name: "GPT-OSS-20B"
    path: "unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-UD-Q8_K_XL.gguf"
    size_gb: 13
    vram_gb: 14
    parts: 1
    test_strategy: "both"  # Works with llama-bench (quick) and llama-server (comprehensive)
    use_case: "Speed champion (<2s responses)"
    baseline: "fully-optimized small MoE reference (software-maturity anchor)"
    hf_repo: "unsloth/gpt-oss-20b-GGUF"
    hf_file: "gpt-oss-20b-UD-Q8_K_XL.gguf"

# Context profiles for different testing scenarios
context_profiles:
  quick:
    - prompt: 512
      generation: 128

  standard:
    - prompt: 512
      generation: 128
    - prompt: 4096
      generation: 512
    - prompt: 16384
      generation: 512

  comprehensive:
    - prompt: 512
      generation: 128
    - prompt: 2048
      generation: 256
    - prompt: 4096
      generation: 512
    - prompt: 8192
      generation: 512
    - prompt: 16384
      generation: 512
    - prompt: 32768
      generation: 512
