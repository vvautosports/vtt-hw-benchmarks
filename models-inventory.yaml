  - name: "GLM-4.7-Flash-Q8"
    path: "unsloth/GLM-4.7-Flash-GGUF/GLM-4.7-Flash-UD-Q8_K_XL.gguf"
    size_gb: 33
    vram_gb: 35
    parts: 1
    test_strategy: "both"  # Works with llama-bench (quick) and llama-server (comprehensive)
    use_case: "Current champion - best efficiency"
    hf_repo: "unsloth/GLM-4.7-Flash-GGUF"
    hf_file: "GLM-4.7-Flash-UD-Q8_K_XL.gguf"

  # REMOVED 2026-08-26 (issue #8 reconcile): DeepSeek-R1-Distill-Llama-70B —
  # not on Framework disk (gone in/before the 504GB cleanup). Dense-reasoning
  # control role now covered by Apriel-1.5-15b-Thinker (retention table in
  # UNSLOTH-DIRECTION.md); re-add with a fresh entry if a dense-70B control
  # is needed again.

  # MiniMax-M2.1 deleted 2026-08-26 (retention policy: successor M2.5 on disk)

  # MiniMax-M2.5 UD-Q3_K_XL (95 GB) deleted 2026-08-27 (Kal-approved cleanup for the
  # Qwen3.8 quant ladder). Evidence: after the unified-memory fix it terminates, but the
  # bleed-order test showed the Q3 copy is genuinely fragile — first-request code ran to
  # the 8192 cap with incoherent output, and its earlier code "pass" was flattered by
  # b10639 cross-request state bleed (2026-08-27-bleed-order-test). Designated successor:
  # MiniMax-M3 on disk (family), or a UD-Q8 re-pull of M2.5 if the M2.5-vs-M3 comparison
  # is ever revived.

  - name: "Qwen3.8-Flash-Next"
    # Day-one model (released 2026-08-26): 125B-A6B MoE, qwen4exp arch, 262K ctx.
    # Thinker/driver candidate for the dual-agent architecture (UNSLOTH-DIRECTION.md).
    #
    # UPDATED 2026-08-27: was UD-Q3_K_XL (84 GB) living in the HF cache on the home
    # partition. Upgraded to UD-Q4_K_XL on /mnt/ai-models. No UD-Q8 exists for this
    # model, so Q4 is the top tier available and it is NOT Q8-comparable to the rest
    # of the roster — do not rank it against Q8 entries on quality.
    path: "unsloth/Qwen3.8-Flash-Next-GGUF/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"
    size_gb: 104
    vram_gb: 112
    parts: 4
    test_strategy: "server_only"  # Multi-part (4 files): requires llama-server
    use_case: "Thinker candidate — long-context MoE, reasoning_effort dial"
    requires_runtime: "b10639+ (qwen4exp arch; b10472 cannot load it at all)"
    tps: "204.7 / 224.7 / 217.0 — ALL capped at max_tokens"
    quality: "0/3"
    status: "LOADS BUT UNUSABLE — do not put in a rotation"
    benchmarked: >-
      2026-08-27 on b10639. The arch blocker IS lifted: it loads and generates, and at
      204-225 t/s it is by far the fastest thing measured on this box (credible for a
      125B-A6B MoE with ~6B active at Q4). But it never terminates — all three tasks ran to
      the 8192-token cap, so those rates are not a ranking. Likely incomplete stop-token /
      EOS handling in an architecture the fork carries as an OPEN, unmerged upstream PR
      (ggml-org/llama.cpp#27742). Re-test when that PR merges upstream.
    note: >-
      The superseded UD-Q3_K_XL copy is still the sole occupant of ~/.cache/huggingface
      (84 of that directory's 85 GB — everything else in there is 4 KB of metadata). It is
      NOT redundant blobs. Once this Q4 copy is validated on b10639 the Q3 copy becomes a
      clean retention-policy deletion with a designated successor; until then, purging that
      cache deletes a model.
    hf_repo: "unsloth/Qwen3.8-Flash-Next-GGUF"
    hf_file: "UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"

  # Reconciled 2026-08-26 (issue #8): actual dir is Qwen/qwen3-235b-a22b
  - name: "Qwen3-235B-A22B-Instruct"
    path: "Qwen/qwen3-235b-a22b/Qwen3-235B-A22B-Instruct-2507-UD-Q3_K_XL-00001-of-00003.gguf"
    size_gb: 98
    vram_gb: 105
    parts: 3
    test_strategy: "server_only"  # Multi-part (3 files): requires llama-server
    use_case: "Ultra-large model testing (235B params)"
    baseline: "parameter-scaling / prev-gen large MoE (retention-policy control)"
    hf_repo: "unsloth/Qwen3-235B-A22B-Instruct-GGUF"
    hf_file: "Qwen3-235B-A22B-Instruct-2507-UD-Q3_K_XL-00001-of-00003.gguf"

  # Reconciled 2026-08-26 (issue #8): on-disk copy is UD-Q8_K_XL, not F16
  - name: "GPT-OSS-20B"
    path: "unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-UD-Q8_K_XL.gguf"
    size_gb: 13
    vram_gb: 14
    parts: 1
    test_strategy: "both"  # Works with llama-bench (quick) and llama-server (comprehensive)
    use_case: "Speed champion (<2s responses)"
    baseline: "fully-optimized small MoE reference (software-maturity anchor)"
    hf_repo: "unsloth/gpt-oss-20b-GGUF"
    hf_file: "gpt-oss-20b-UD-Q8_K_XL.gguf"

