# Champion re-baseline under --disable-tools. Closes the last open caveat on the corpus:
# every t/s and token-economy number measured before this was inflated by server-side
# tool injection. This is the first clean speed table for the roster.
run_id: "2026-08-28-rebaseline-toolsoff"
date: "2026-08-28"
node: "kalman9-framework-01"
hardware: "AMD Strix Halo (Radeon 8060S iGPU), GTT unlock ACTIVE, ~122 GB usable"
backend: "unsloth-studio"
runtime_build: "b10639-mix-f6f92fe"
studio_version: "unsloth 2026.8.22"
api: "/v1/chat/completions"
isolation: "fresh-server-per-task (isolated_battery.py)"
request_constants:
  seed: 42
  max_tokens: 8192
  profile: thinking
  reasoning_effort: low
launch_env:
  UNSLOTH_DISABLE_UNIFIED_MEMORY: "1"
launch_flags: "--disable-tools"

axis: cfg
records: "results.jsonl"
outputs: "outputs/<cfg>/<task>--thinking--low.txt"
grading: "py scripts/utils/grade_sweep.py results/sweeps/2026-08-28-rebaseline-toolsoff results --layout cfg"
driver_script: "scripts/sweeps/isolated_battery.py"

# t/s as reasoning / code / summarize. "prev" is the best previously-published number for
# that model, all of which were measured with server-side tools ON.
entries:
  - cfg: "Ornith-1.5-35B-A3B__toolsoff"
    quant: "Q8_0"
    tps: "64.52 / 63.91 / 57.39"
    prev: "54.1 / 52.7 / 56.6"
    quality: "3/3 PASS"
    note: "New roster speed leader on clean numbers. Largest gain of any model, ~+19% on reasoning."

  - cfg: "NVIDIA-Nemotron-3.5-Lightning-30B-A3B__toolsoff"
    quant: "UD-Q8_K_XL"
    tps: "63.14 / 62.01 / 62.94"
    prev: "56.0 / 56.3 / 53.2"
    quality: "2/3 — summarize FAIL"
    note: >-
      Fastest and most uniform across the three tasks. The summarize failure is a FORMAT
      miss, not a comprehension one: the model produced exactly 5 correct bullets and a
      correct one-sentence summary but omitted the literal "TL;DR" label the grader
      requires (quality.bullets=5, has_tldr=false). Worth a second seed before treating
      this as a real regression against its previous 3/3.

  - cfg: "Qwen3.6-35B-A3B-MTP__toolsoff"
    quant: "UD-Q8_K_XL"
    tps: "61.25 / 62.28 / 61.90"
    prev: "54.8 / 57.7 / 48.9"
    quality: "3/3 PASS"
    note: "Third of a tight top-three cluster. Biggest summarize gain on the roster (+27%)."

  - cfg: "Qwen3-Coder-30B-A3B-Instruct__toolsoff"
    quant: "UD-Q8_K_XL"
    tps: "43.70 / 43.55 / 40.27"
    prev: "39.9 / 74.5 / 38.2"
    quality: "3/3 PASS"
    note: >-
      THE ANOMALY OF THIS RUN, since RESOLVED. Every other model gained 10-21%; this one's
      code cell went the other way, 74.5 -> 43.55, and the profile flattened (spiky
      39.9 / 74.5 / 38.2 -> flat 43.7 / 43.55 / 40.27). The same-day A/B
      (2026-08-28-coder30b-code-anomaly) explains it: server-side tools inflated this task's
      OUTPUT ~4.3x (3009 vs 737 completion tokens) with repetitive tool-loop scaffolding,
      and n-gram speculation drafted that boilerplate extremely well. The 74.5 was real
      throughput on work no consumer wanted. 43.55 is the true figure.

  - cfg: "GLM-4.7-Flash__toolsoff"
    quant: "UD-Q8_K_XL"
    tps: "34.76 / 33.90 / 33.48"
    prev: "31.7 / 36.1 / 31.8"
    quality: "3/3 PASS"
    note: "Baseline control. Modest, even gain; code cell essentially flat."

  - cfg: "gpt-oss-120b__toolsoff"
    quant: "F16 (native MXFP4 MoE weights)"
    tps: "33.10 / 33.83 / 30.29"
    prev: "27.3 / 32.0 / 31.2"
    quality: "3/3 PASS"
    note: "Largest reasoning gain (+21%). A 120B-class model matching GLM-4.7-Flash (33 GB) on t/s."

summary: >-
  17/18 cells pass. Prompt tokens across the whole run are 91-586, against the 2,000-16,000
  seen in contaminated records — the injection is definitively gone.

  Removing it raised throughput 10-21% for five of six models, so the entire previously
  published speed table understated the roster. It also RESHUFFLED the order: the clean
  top three are Ornith-1.5 (64.5), Nemotron-3.5 (63.1) and Qwen3.6-35B-MTP (61.3), a much
  tighter cluster than the old numbers implied, with Qwen3-Coder-30B dropping to ~43 and
  GLM-4.7-Flash and gpt-oss-120b converging at ~33-34.

  The single exception is Qwen3-Coder-30B's code cell, which moved DOWN and against the
  trend. A same-day 2x2 (2026-08-28-coder30b-code-anomaly) resolved it: the old 74.5 was
  speculative decoding racing through ~3000 tokens of tool-injection boilerplate, not code
  speed. That also carries a corpus-wide warning — the inflation is uneven across models
  and tasks (it depends on how much boilerplate each emitted and how well speculation
  drafted it), so old numbers cannot be corrected by scaling. They must be re-measured.

verdicts:
  injection_cleared: >-
    YES. This table supersedes every previously published t/s figure for these six models.
  leaderboard_changed: >-
    YES. Ornith-1.5 is the clean speed leader; the top three are within 5% of each other.
  code_king_title: >-
    RESOLVED same day by 2026-08-28-coder30b-code-anomaly. The 74.5 was speculative
    decoding accelerating ~3000 tokens of tool-injection boilerplate, not code-generation
    speed. True clean figure is ~43.6 t/s, stable with speculation on or off. Retired as a
    speed claim; the 3/3 quality record stands.

caveats:
  coder30b_code_anomaly: >-
    RESOLVED — see results/sweeps/2026-08-28-coder30b-code-anomaly/. It was BOTH candidates
    at once: tools inflated code output ~4.3x (3009 vs 737 completion tokens) with
    repetitive tool-loop scaffolding, and n-gram speculation drafted that boilerplate
    extremely well. Holding the injected work and removing speculation drops code 65.5 ->
    40.68; holding speculation and removing the injected work changes nothing (43.61 vs
    43.99). The 74.5 was real throughput on work no consumer wanted.
  nemotron_summarize_format_miss: >-
    quality.bullets=5, has_tldr=false. The content is correct; only the literal "TL;DR"
    label is absent. The grader is strict here by design (it catches models that drift out
    of a requested output contract), but this should not be read as a capability
    regression from its earlier 3/3 without a second seed.
  single_seed: >-
    One sample per cell at temperature 1.0 (thinking profile). Deltas of a few percent are
    within noise; the 10-21% shifts are well outside it, but the Nemotron format miss and
    the Coder-30B anomaly are both single observations.
  speculation_unpinned: >-
    All six ran with studio's automatic speculative-decoding selection (no
    --speculative-type pinned), so per-model speculation strategy is an uncontrolled
    variable across rows. This matters most for the Coder-30B anomaly above.
