      on every axis by models a third its size.
    evidence: "Roster leaderboard; results/sweeps/2026-08-27-toolsoff-rerun-ab"
  - name: "Nemotron-3-Nano-30B-A3B"
    model_key: null
    in_inventory: false
    reason: >-
      Deleted from disk 2026-08-27. Its only selling point -- "runs correctly on default
      flags" while 3.5-Lightning needed --speculative-type off -- was eliminated when the
      unified-memory root cause was found. Successor: Nemotron-3.5-Lightning.
    evidence: "Retired / demoted models; results/sweeps/2026-08-27-b10639-rebaseline-batch"
