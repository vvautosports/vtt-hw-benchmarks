      Demoted, not deleted. Rehabilitated to 3/3 in isolation after the first run was
      confounded by a concurrent download and the unified-memory bug, but its code task
      still fails under cross-request state bleed at 2/3 and it never beats Coder-30B's
      throughput. "No promotion pending a bleed fix."
