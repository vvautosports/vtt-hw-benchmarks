    model_key: null
    in_inventory: false
    reason: >-
      Copy deleted 2026-08-27. Fragile independent of the runtime bugs: first-request code
      runs to the 8192 cap with incoherent output, and its earlier pass was flattered by
      cross-request context bleed. Indicts the Q3 copy, not necessarily the family.
    evidence: "Retired / demoted models; results/sweeps/2026-08-27-bleed-order-test"
  - name: "Qwen3.8-Flash-Next @ 204-225 t/s"
    model_key: null
    in_inventory: false
    reason: >-
      Retired CLAIM, not a retired model. Those figures were the unified-memory corruption
      generating garbage tokens at high speed while never terminating (0/3, all capped).
      Superseded by the umfix batch. Never cite them.
    evidence: "Retired / demoted models; 2026-08-27-b10639-batch vs -umfix-batch"

