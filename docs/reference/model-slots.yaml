# Slot assignments for the MLflow model registry.
#
# HAND-DERIVED from docs/reference/PERFORMANCE-SUMMARY.md (dated 2026-08-28). Every
# entry carries the summary line it was derived from in `evidence:` so a promotion
# argument can be checked against the doc without re-reading the sweeps.
#
# This file is the INPUT to scripts/utils/register_models.py, which sets the
# `champion-<slot>` / `challenger-<slot>` aliases on the MLflow registry. The registry
# is the alias authority (EVIDENCE-LAKEHOUSE-REFERENCE-ARCH.md §6, "Two registries,
# split roles"); this YAML is the reviewable source that produces it.
#
# To promote: edit the champion/challenger here, open a PR that cites the run ids in
# `evidence:`, and re-run register_models.py after merge. Do not move an alias by hand
# in the MLflow UI -- the alias would then disagree with this file.
#
# model_key format: "<hf_repo_id>#<quant>", where hf_repo_id is the `hf_repo` field in
# models-inventory.yaml and quant is the token parsed out of the GGUF filename by the
# same regex scripts/utils/log_sweep_to_mlflow.py uses (QUANT_RE). Quant case is taken
# VERBATIM from the filename -- that is why Qwen3-8B-128K is `#q8_0` (lowercase) while
# Ornith is `#Q8_0`. Matching the existing tool's casing is what makes the registry
# join to sweep-run tags.

version: "1.0"
generated: "2026-09-06"
source_doc: "docs/reference/PERFORMANCE-SUMMARY.md"
source_doc_date: "2026-08-28"
source_hardware: "Framework Desktop (AMD Strix Halo), b10639-mix-f6f92fe, UNSLOTH_DISABLE_UNIFIED_MEMORY=1"
key_format: "<hf_repo_id>#<quant>"
alias_format: "champion-<slot> / challenger-<slot>"

slots:

  coding:
    description: >-
      Code generation. Graded on the battery's doctest-compliant code task; picked on
      quality, not throughput -- the summary is explicit that the old speed argument for
      this slot was an artifact.
    champion:
      model_key: "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF#UD-Q8_K_XL"
      inventory_name: "Qwen3-Coder-30B-A3B-Instruct"
      section: "Which model for which job"
      evidence: >-
        "Code generation: Qwen3-Coder-30B-A3B-Instruct, 3/3 clean - but pick it for
        QUALITY, not speed. ... True clean code speed is ~43.6 t/s"
      runs:
        - "results/sweeps/2026-08-28-rebaseline-toolsoff"
        - "results/sweeps/2026-08-28-coder30b-code-anomaly"
    challenger:
      model_key: "ornith-ai/Ornith-1.5-35B-A3B-GGUF#Q8_0"
      inventory_name: "Ornith-1.5-35B-A3B"
      section: "Which model for which job / Roster leaderboard"
      evidence: >-
        "the three ~62 t/s models above beat it on every task" -- Ornith is the 3/3 member
        of that group with the highest code figure (63.9 t/s vs the champion's 43.6),
        so it is the standing speed challenge to a quality-picked champion.
      runs:
        - "results/sweeps/2026-08-28-rebaseline-toolsoff"
      caveat: >-
        ornith-ai's own Q8_0 GGUF, not an unsloth UD quant -- not like-for-like on quant
        quality against the rest of the roster (models-inventory.yaml note).

  reasoning:
    description: >-
      Fast general workhorse / multi-step reasoning with a verifiable answer. The top of
      the leaderboard is a three-way statistical tie, so this slot is decided on quality.
    near_tie: true
    near_tie_note: >-
      Ornith-1.5-35B-A3B, Nemotron-3.5-Lightning-30B-A3B and Qwen3.6-35B-A3B-MTP are
      within 5% of each other. Per the convention for this file the FIRST-LISTED model in
      the summary is taken as champion -- which here also agrees with the quality tiebreak
      the summary itself recommends (Ornith 3/3 vs Nemotron 2/3).
    champion:
      model_key: "ornith-ai/Ornith-1.5-35B-A3B-GGUF#Q8_0"
      inventory_name: "Ornith-1.5-35B-A3B"
      section: "Which model for which job"
      evidence: >-
        "Fast general workhorse: Ornith-1.5-35B-A3B (64.5/63.9/57.4, 3/3) ... the top three
        are within 5% of each other, so pick on quality, not speed. ... Ornith is 3/3."
      runs:
        - "results/sweeps/2026-08-28-rebaseline-toolsoff"
    challenger:
      model_key: "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF#UD-Q8_K_XL"
      inventory_name: "Nemotron-3.5-Lightning-30B-A3B"
      section: "Which model for which job"
      evidence: >-
        "or Nemotron-3.5-Lightning-30B-A3B (63.1/62.0/62.9) ... Nemotron is the most
        uniform across tasks but drops the literal 'TL;DR' label on the summarize contract"
      runs:
        - "results/sweeps/2026-08-28-rebaseline-toolsoff"
        - "results/sweeps/2026-08-28-nemotron-tldr-seeds"
      caveat: >-
        2/3 only because of the missing "TL;DR" label -- a format habit, five correct
        bullets present. Also carries the Tier-2 parallel-call defect (see tool-calling).

  tool-calling:
    description: >-
      Client-tool passthrough, graded on server-parsed tool_calls at the raw healing rung
      (--disable-tools --disable-tool-call-healing --disable-tool-call-nudging).
      Tier 1 is a saturated 90/90 floor; Tier 2 is the ranking axis.
    near_tie: true
    near_tie_note: >-
      Four models sit at 7/7 on Tier 2. First-listed (Qwen3-Coder-30B) is taken as
      champion. Coder-Next is skipped for challenger because it appears in the
      retired/demoted table; Qwen3.8-Flash-Next is skipped because it is the only UD-Q4
      entry on an otherwise Q8 roster (models-inventory.yaml forbids ranking it against
      Q8 entries) and it already holds long-context + thinker. GLM-4.7-Flash therefore
      takes the challenger alias.
    champion:
      model_key: "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF#UD-Q8_K_XL"
      inventory_name: "Qwen3-Coder-30B-A3B-Instruct"
      section: "Tool-calling (Track 1)"
      evidence: >-
        "Qwen3-Coder-30B / Coder-Next / Qwen3.8-Flash-Next / GLM-4.7-Flash | 7/7 | -"
      runs:
        - "results/sweeps/2026-08-28-toolcall-tier2"
        - "results/sweeps/2026-08-28-toolcall-tier1"
    challenger:
      model_key: "unsloth/GLM-4.7-Flash-GGUF#UD-Q8_K_XL"
      inventory_name: "GLM-4.7-Flash-Q8"
      section: "Tool-calling (Track 1)"
      evidence: >-
        Same 7/7 row; GLM-4.7-Flash is additionally the leaderboard's "baseline control"
        at 34.8/33.9/33.5, 3/3.
      runs:
        - "results/sweeps/2026-08-28-toolcall-tier2"
    excluded:
      - model: "Nemotron-3.5-Lightning-30B-A3B"
        reason: >-
          6/7 -- parallel-call serialisation: reasoning plans 3 calls, emits 1. Reproduced
          on the HP G1a, so a model trait, not a box artifact.
      - model: "gpt-oss-120b"
        reason: >-
          5/7 -- same 1-of-3 parallel gap plus union collapse; also abandons the deep
          chain at 31 calls where every other model survives 60.

  long-context:
    description: >-
      Long prompts and mid-document retrieval. Only two roster models have any
      long-context evidence at all, and one of them is missing from models-inventory.yaml.
    champion:
      model_key: "unsloth/Qwen3.8-Flash-Next-GGUF#UD-Q4_K_XL"
      inventory_name: "Qwen3.8-Flash-Next"
      section: "Which model for which job"
      evidence: >-
        "Long-context thinker / interrupt-driven agent: Qwen3.8-Flash-Next, 125B-A6B MoE,
        262K ctx claim."
      runs:
        - "results/sweeps/2026-08-27-b10639-umfix-batch"
        - "results/sweeps/2026-08-27-qwen38-settings-matrix"
      caveat: >-
        UD-Q4_K_XL -- the only non-Q8 top-tier copy on the roster; the 262K figure is the
        model's claim, not a measured ceiling on this box.
    challenger:
      model_key: null
      candidate: "DeepSeek-V4-Flash-0731"
      status: "unregisterable"
      blocked_by: >-
        Absent from models-inventory.yaml. It is on the leaderboard and has the strongest
        measured long-context evidence on the fleet, but the registry is built from the
        inventory and no hf_repo/hf_file row exists for it, so no model_key can be formed
        without inventing one. Add an inventory row, re-run register_models.py, then set
        this model_key.
      section: "Roster leaderboard"
      evidence: >-
        "The 16384 context pin is RETIRED: the ctx ladder loads+serves every rung to 98304
        (~21 GiB still free; MLA latent-KV ~0.03 GiB/1k ctx) and the needle probe grades
        3/3 mid-document retrieval to ~35k tokens. 65536 is the new setting."
      runs:
        - "results/sweeps/2026-08-28-deepseek-ctx-ladder"
        - "results/sweeps/2026-08-28-deepseek-needle"

  memory-tight:
    description: >-
      Smallest footprint that still grades 3/3 -- the pick when the box is also running
      something else (co-residency).
    champion:
      model_key: "unsloth/gemma-4-26B-A4B-it-GGUF#UD-Q8_K_XL"
      inventory_name: "gemma-4-26B-A4B-it"
      section: "Which model for which job"
      evidence: >-
        "Memory-tight / fastest small MoE: gemma-4-26B-A4B-it - 26GB footprint, ~36 t/s,
        3/3, stable across both runtime versions and both GTT states tested. Best choice
        when the box is also running something else."
      runs:
        - "results/sweeps/2026-08-27-b10639-rebaseline-batch"
        - "results/sweeps/2026-08-27-receipt-battery-g1a"
    challenger:
      model_key: "unsloth/Qwen3.8-27B-GGUF#UD-Q8_K_XL"
      inventory_name: "Qwen3.8-27B"
      section: "Roster leaderboard"
      evidence: >-
        "Qwen3.8-27B | 27B | UD-Q8_K_XL | 13.5 / 13.5 / 13.2 | 3/3" -- the next-smallest
        3/3 footprint on the leaderboard (30 GB) after the champion's 26 GB.
      runs:
        - "results/sweeps/2026-08-27-roster-validation"
      caveat: >-
        Measured on b10472, NOT yet re-baselined on b10639 -- provisional per the
        summary's "Note on runtimes". Also ~2.6x slower than the champion.
    untested_candidate:
      model: "gpt-oss-20b (unsloth/gpt-oss-20b-GGUF#UD-Q8_K_XL)"
      note: >-
        13 GB on disk and the only roster entry that fits a 16 GB GPU
        (models-inventory.yaml light mode), which would make it the natural memory-tight
        pick -- but it has NO row in PERFORMANCE-SUMMARY, so there is no graded evidence
        to promote it on. Run the battery against it before considering it for this slot.

  thinker:
    description: >-
      Deliberate/extended reasoning with a cost dial -- the model a driver agent hands a
      hard problem to when latency is not the constraint.
    champion:
      model_key: "unsloth/Qwen3.8-Flash-Next-GGUF#UD-Q4_K_XL"
      inventory_name: "Qwen3.8-Flash-Next"
      section: "Which model for which job"
      evidence: >-
        "Use the reasoning_effort dial: low as the idle/default (15.6/22.3/17.1 t/s, tight
        token economy), xhigh when you need the most thorough answer ... instruct mode is
        the fastest config (107s battery wall) and still passes everything"
      runs:
        - "results/sweeps/2026-08-27-b10639-umfix-batch"
        - "results/sweeps/2026-08-27-qwen38-settings-matrix"
      caveat: >-
        Cite ONLY the umfix figures. The earlier 204-225 t/s numbers were the
        unified-memory bug generating garbage at speed and never terminating (0/3).
    challenger:
      model_key: null
      candidate: "gpt-oss-120b"
      status: "unregisterable"
      blocked_by: >-
        Absent from models-inventory.yaml, and no hf_repo id for it appears anywhere in
        the repo (the leaderboard, the baselines manifest and the sweep records all name
        it only as "gpt-oss-120b"). A model_key cannot be formed without inventing a repo
        id. Add an inventory row with the real hf_repo/hf_file, re-run, then set this key.
      section: "Which model for which job"
      evidence: >-
        "Large-model anchor: gpt-oss-120b - 120B-class, 30-34 t/s clean, 3/3, tight token
        economy" and, on the leaderboard, "largest reasoning gain on the roster (+21%)".
      runs:
        - "results/sweeps/2026-08-27-baselines-235b-oss120b"
        - "results/sweeps/2026-08-28-rebaseline-toolsoff"
      caveat: >-
        Carries two Tier-2 tool-calling defects (5/7) and abandons the deep chain at 31
        calls -- a thinker, not an agent driver.

